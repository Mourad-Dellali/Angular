<form (ngSubmit)="onSubmit()">
    <div  class="input-group">
        <p>
        <label>Initial Investment</label>
        <input type="number" id="initialInvestment" name="initialInvestment" [(ngModel)]="enteredData.initialInvestment" />
        </p>
   
    
       <p> <label>Anual Investment</label>
        <input type="number" id="anualInvestment" name="anualInvestment" [(ngModel)]="enteredData.annualInvestment" /></p>
   </div>
   <div  class="input-group">
        <p><label>Expected Return</label>
        <input type="number" id="expectedReturn" name="expectedReturn" [(ngModel)]="enteredData.expectedReturn" /></p>
    
    
        <p>
        <label>Duration</label>
        <input type="number" id="duration" name="duration" [(ngModel)]="enteredData.duration" />
        </p>
    </div>
    <p>
        <button> Calculate </button>
    </p>
</form>
