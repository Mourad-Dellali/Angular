<div class="page">
  <h1 class="page-title">Jobs</h1>

  <dx-form
    [formData]="filters"
    [colCount]="4"
    (onFieldDataChanged)="onFieldChanged($event)">

    <dxi-item dataField="from" editorType="dxDateBox"
      [editorOptions]="{ type: 'datetime', displayFormat: 'yyyy-MM-dd HH:mm', width: '100%' }">
      <dxo-label text="De"/>
    </dxi-item>

    <dxi-item dataField="to" editorType="dxDateBox"
      [editorOptions]="{ type: 'datetime', displayFormat: 'yyyy-MM-dd HH:mm', width: '100%' }">
      <dxo-label text="À"/>
    </dxi-item>

    <dxi-item dataField="pageSize" editorType="dxNumberBox"
      [editorOptions]="{ min: 1, max: 200, showSpinButtons: true, width: '100%' }">
      <dxo-label text="Page Size"/>
      <dxi-validation-rule type="range" [min]="1" [max]="200"/>
    </dxi-item>

    <dxi-item itemType="button"
      [buttonOptions]="{ text: 'Rechercher', type: 'default', stylingMode: 'contained',
        disabled: loading() || dateRangeError, onClick: loadFirstPage.bind(this) }">
    </dxi-item>

  </dx-form>

  @if (dateRangeError) {
    <div class="date-error">De doit être avant ou égale à À.</div>
  }

  <div class="toolbar">
    <dx-load-indicator [visible]="loading()"/>
  </div>

  <div class="table-wrap">
    <dx-data-grid
      [dataSource]="jobs()"
      keyExpr="id"
      [showBorders]="false"
      [showRowLines]="true"
      [rowAlternationEnabled]="false">

      <dxi-column dataField="id" caption="ID" cellTemplate="idTemplate"/>
      <dxi-column dataField="status"    caption="Status"/>
      <dxi-column dataField="createdAt" caption="Créé le" dataType="datetime" format="yyyy-MM-dd HH:mm:ss"/>

      <div *dxTemplate="let cell of 'idTemplate'">
        <a [routerLink]="['/jobs', cell.value]" class="job-link">{{ cell.value }}</a>
      </div>

    </dx-data-grid>
  </div>

  <div class="table-footer">
    <div class="pager">
      <dx-button
        text="Page suivante"
        stylingMode="outlined"
        [disabled]="!hasMore() || loading()"
        (onClick)="loadNextPage()"/>
    </div>
  </div>
</div>
